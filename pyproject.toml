[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zros2"
version = "2.0.0"
description = "Zenoh ROS 2 bridge — lightweight ROS2-like communication over Zenoh"
authors = [
    { name = "Dafan Wang" },
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["zenoh", "ros2", "ros", "robotics", "dds", "cdr"]

dependencies = [
    "eclipse-zenoh>=1.9.0,<2",
    "pycdr2>=1.0.0,<2",
    "lark>=1.3.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=5.1",
    "pytest-cov>=5.0",
    "pyright>=1.1.400",
    "ruff>=0.16",
]

[project.scripts]
zros2-gen = "zros2.generator.__main__:main"

[project.urls]
Homepage = "https://github.com/HKCLR2021/zros2"
Repository = "https://github.com/HKCLR2021/zros2.git"

[tool.setuptools.packages.find]
where = ["src"]
include = ["zros2*"]

[tool.setuptools.package-data]
"zros2" = ["py.typed"]
"zros2.generator.assets" = [
    "builtin_msgs/**/*.msg",
    "builtin_msgs/**/*.srv",
    "builtin_msgs/**/*.action",
    "builtin_msgs/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "benchmarks.py"]


[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["zros2"]
